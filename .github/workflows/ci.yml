name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run compile:java
      - run: npm run lint
      - run: npm test
      - run: npm run bundle

      - name: End-to-end tests in VS Code
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e

      - name: Package extension
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out xslt-transformer.vsix

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: xslt-transformer.vsix
