name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run compile:java
      - run: npm run lint
      - name: Test
        run: npm run test:ci
      - name: Report failing tests
        if: failure()
        shell: bash
        # Annotations are visible without signing in, unlike the job log
        run: |
          [ -f test-results.tap ] || exit 0
          grep -n "^ *not ok" test-results.tap | while read -r line; do echo "::error title=Test failed (${{ matrix.os }})::$line"; done
          grep -A12 "^ *not ok" test-results.tap | grep -E "error:|message:|expected|actual" | head -40 | while read -r line; do echo "::error title=Failure detail (${{ matrix.os }})::$line"; done
      - run: npm run bundle

      - name: End-to-end tests in VS Code
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e

      - name: Package extension
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out xslt-transformer.vsix

      - uses: actions/upload-artifact@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: xslt-transformer.vsix
